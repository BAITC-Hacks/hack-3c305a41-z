# Настройки эвристик, не обученная модель и не вероятность виновности.
random_seed: 42 # Фиксированный порядок случайных операций для повторяемости.
data:
  max_depth: 4 # Граница обхода организаторов.
  min_transaction_kzt: 5000 # Порог включения переводов из README датасета.
  period_start: '2026-07-01'
  period_end: '2026-07-31'
  amount_tolerance: 0.01 # Допуск сверки агрегатов: одна сотая KZT.
  expected: {nodes: 2248, edges: 3119, transactions: 4840, seeds: 81}
features:
  pagerank_alpha: 0.85 # Стандартное затухание PageRank; не критерий роли.
  pagerank_tolerance: 0.000001 # Критерий численной сходимости.
  pagerank_max_iterations: 1000 # Ограничение вычислений, ошибка сходимости явная.
  betweenness_sample: null # На данном объёме считаем точно; число включает сэмплирование.
  normalization_quantile: 0.95 # Уменьшает влияние единичных экстремальных значений; по положительным.
roles:
  minimum_score: 0.50 # Требуем хотя бы половину максимальной поддержки правила.
  fallback_cap: 0.49 # Peripheral не получает высокую уверенность из отсутствия признаков.
  tie_order: [coordinator, consolidator, distributor, transit, terminal]
  consolidator:
    min_in_degree: 3 # Минимальный сбор от нескольких независимых контрагентов.
    max_pass_through: 0.6 # В выборке далее ушло не больше 60% входящих.
    max_concentration: 0.75 # Один плательщик не должен объяснять почти весь сбор.
    weights: {breadth: 0.4, diversity: 0.3, retention: 0.3}
  distributor:
    min_out_degree: 10 # Веер заметно шире обычной цепочки; стартовая эвристика.
    weights: {breadth: 0.7, volume: 0.3}
  transit:
    min_ratio: 0.8 # Допуск ±20%: неполная месячная выборка не даёт точного баланса.
    max_ratio: 1.2
    weights: {balance: 0.7, volume: 0.3}
  terminal:
    # Применяется только если не выполнены условия consolidator: сбор с многих — более специфичный признак.
    min_in_kzt: 50000 # Не меньше десяти минимальных переводов; исследовать чувствительность.
    weights: {no_outgoing: 0.6, volume: 0.4}
  coordinator:
    min_depth: 2 # Ищем структуру за пределами непосредственного первого колена.
    min_seed_sources: 2 # Требуем достижимость минимум от двух seed.
    min_normalized_betweenness: 0.7 # Верхняя часть шкалы посредничества после p95-нормировки.
    weights: {brokerage: 0.7, sources: 0.3}
clusters:
  resolution: 1.0 # Базовый масштаб Louvain, без подгонки к количеству сообществ.
  threshold: 0.0000001 # Минимальный прирост модульности алгоритма.
  top_gids_count: 3 # Краткая сводка ключевых узлов каждого кластера.
priority:
  weights: {role: 0.4, sources: 0.2, volume: 0.2, brokerage: 0.2}
  role_values: {coordinator: 1.0, consolidator: 0.9, distributor: 0.7, transit: 0.5, terminal: 0.4, peripheral: 0.1}
  top_count: 20 # Обязательный минимум ТЗ; маленький тестовый граф отдаёт все узлы.
temporal:
  # Сигналы времени из transactions.parquet. Сообщаются рядом с ролью, но её не меняют:
  # критерии ролей должны оставаться стабильными и проверяемыми.
  fast_pass_days: 2 # «Пришло и ушло» по формулировке ТЗ — в течение 1–2 дней.
  fast_pass_min_share: 0.5 # Больше половины исходящих ушло быстро — признак сквозного транзита.
  sync_min_payers: 3 # Трое и более разных плательщиков в один день — синхронность, а не совпадение.
resilience:
  # Что станет с сетью при изъятии топ-N узлов и лучше ли наш порядок случайного.
  steps: [0, 5, 10, 20, 30, 50, 80] # Точки кривой разрушения.
  random_trials: 5 # Усреднение случайной стратегии; сиды фиксированы.
  headline_step: 20 # Шаг, который выносится в сводку и в интерфейс.
export:
  evidence_max_chars: 200 # Ограничение ТЗ.
  max_runtime_seconds: 300 # Ограничение ТЗ на полный прогон.
viewer:
  max_nodes: 80 # Ограничиваем перегруженность графа; полный список соседей остаётся в таблице.
  height: 560 # Высота интерактивной схемы в пикселях.
  layout_seed: 42 # Повторяемый начальный layout.
  stabilization_iterations: 150 # Ограничение времени раскладки в браузере.
llm:
  # Слой агентов. Пайплайн полон и без него: флаг --llm только переписывает тексты.
  api_key_env: OPENAI_API_KEY # Ключ читается из окружения, в репозиторий не попадает.
  models: {writer: gpt-5.4-mini, critic: gpt-5.4-mini, assistant: gpt-5.4-mini} # Проверено по /v1/models выданным ключом.
  temperature: 0.2 # Низкая: нужен пересказ чисел, а не сочинение.
  max_output_tokens: 400 # Тексты короткие, лимит бережёт время прогона.
  timeout_seconds: 30 # Зависший вызов не должен блокировать расчёт.
  retries: 1 # Одна повторная попытка, дальше остаётся офлайн-текст.
  max_parallel: 8 # Одновременные вызовы внутри одного агента.
  length_budget: 0.8 # Просим текст короче предела ТЗ: перебор тогда всё равно укладывается.
  top_nodes: 20 # Переписываем обоснования только приоритетным узлам, не всем 2248.
  min_cluster_size: 5 # Гипотезы пишем содержательным кластерам, одиночные узлы не нуждаются.
  assistant_max_steps: 6 # Ограничение цикла вызова инструментов ассистентом.
